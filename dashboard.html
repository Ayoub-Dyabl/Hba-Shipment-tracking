<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBA Operations Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f5f7;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 span {
      color: #f58220;
    }

    header button {
      background: #f58220;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border-top: 4px solid #f58220;
    }

    h2 {
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #f58220;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .btn {
      border: none;
      border-radius: 6px;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-primary {
      background: #f58220;
      color: white;
    }

    .btn-secondary {
      background: #222;
      color: white;
    }

    .btn-delete {
      background: #c62828;
      color: white;
    }

    #message {
      margin-top: 15px;
      font-weight: bold;
    }

    .search-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-row input {
      flex: 1;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #222;
      color: white;
      padding: 12px;
      text-align: left;
    }

    td {
      border-bottom: 1px solid #ddd;
      padding: 12px;
    }

    tr:hover {
      background: #fafafa;
    }

    .edit-btn {
      background: #f58220;
      color: white;
      border: none;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 5px;
    }

    .delete-btn {
      background: #c62828;
      color: white;
      border: none;
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      header {
        padding: 15px;
      }
    }
    .stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 25px;
}

.stat-card {
  background: linear-gradient(135deg, #ffffff, #f8f8f8);
  border-radius: 14px;
  padding: 22px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 5px 18px rgba(0,0,0,0.08);
  border-left: 5px solid #f58220;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

    .delayed-card.alert {
  border-left-color: #dc3545;
  background: #fff5f5;
}

.delayed-card.alert .stat-number {
  color: #dc3545;
}
.stat-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 22px rgba(0,0,0,0.12);
}

.stat-icon {
  font-size: 34px;
}

.stat-label {
  color: #777;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 5px;
}

.stat-number {
  font-size: 30px;
  font-weight: 800;
  color: #222;
}

@media (max-width: 900px) {
  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

@media (max-width: 550px) {
  .stats-grid {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>

<body>

<header>
  <h1>HBA <span>Operations</span></h1>
  <button id="logoutButton">LOGOUT</button>
</header>

<div class="container">
  <div class="stats-grid">

  <div class="stat-card">
    <div class="stat-icon">🚛</div>
    <div>
      <div class="stat-label">Active Shipments</div>
      <div class="stat-number" id="activeCount">0</div>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-icon">🛃</div>
    <div>
      <div class="stat-label">At Border</div>
      <div class="stat-number" id="borderCount">0</div>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-icon">✅</div>
    <div>
      <div class="stat-label">Delivered</div>
      <div class="stat-number" id="deliveredCount">0</div>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-icon">📦</div>
    <div>
      <div class="stat-label">Total Shipments</div>
      <div class="stat-number" id="totalCount">0</div>
    </div>
  </div>
    
<div class="stat-card delayed-card">
  <div class="stat-icon">⚠️</div>
  <div>
    <div class="stat-label">Delayed Shipments</div>
    <div class="stat-number" id="delayedCount">0</div>
  </div>
</div>
    
</div>
  <div class="card">
    <h2>Shipment Management</h2>

    <input type="hidden" id="shipmentId">

    <div class="form-grid">

      <div>
        <label>Tracking Number</label>
        <input id="trackingNumber" placeholder="HBA-2026-0001">
      </div>

      <div>
        <label>Status</label>
        <select id="status">
          <option value="Pending">Pending</option>
          <option value="Loading">Loading</option>
          <option value="In Transit">In Transit</option>
          <option value="At Border">At Border</option>
          <option value="Customs Clearance">Customs Clearance</option>
          <option value="Out for Delivery">Out for Delivery</option>
          <option value="Delivered">Delivered</option>
        </select>
      </div>

      <div>
        <label>Origin</label>
        <input id="origin" placeholder="Dubai, UAE">
      </div>

      <div>
        <label>Destination</label>
        <input id="destination" placeholder="Amman, Jordan">
      </div>

      <div>
        <label>Current Location</label>
        <input id="currentLocation" placeholder="Al Haditha Border">
      </div>

      <div>
        <label>Truck Number</label>
        <input id="truckNumber" placeholder="70546 DXB">
      </div>

      <div>
        <label>Driver Name</label>
        <input id="driverName" placeholder="Driver name">
      </div>

      <div>
        <label>ETA</label>
        <input type="date" id="eta">
      </div>

    </div>

    <div class="actions">
      <button class="btn btn-primary" id="saveButton">
        ADD SHIPMENT
      </button>

      <button class="btn btn-secondary" id="clearButton">
        CLEAR
      </button>
    </div>

    <div id="message"></div>
  </div>


  <div class="card">
    <h2>All Shipments</h2>

    <div class="search-row">
      <input
        id="searchInput"
        placeholder="Search tracking number, driver, truck or destination..."
      >
      <button class="btn btn-primary" id="refreshButton">
        REFRESH
      </button>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Tracking</th>
            <th>Status</th>
            <th>Origin</th>
            <th>Destination</th>
            <th>Location</th>
            <th>Driver</th>
            <th>Truck</th>
            <th>ETA</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="shipmentTable"></tbody>
      </table>
    </div>

  </div>

</div>


<script>

  const supabaseUrl =
    "https://htrcvdnmfodamoatqucb.supabase.co";

  const supabaseKey =
    "sb_publishable_55sANLOQ8OvI822POQnCDg_NebnhOyN";

  const db =
    supabase.createClient(supabaseUrl, supabaseKey);


  const message =
    document.getElementById("message");

  let shipments = [];


  async function checkLogin() {

    const {
      data: { session }
    } = await db.auth.getSession();

    if (!session) {
      window.location.href = "admin.html";
      return false;
    }

    return true;
  }


  async function loadShipments() {

    const loggedIn = await checkLogin();

    if (!loggedIn) return;

    const { data, error } =
      await db
        .from("Shipments")
        .select("*")
        .order("id", {
          ascending: false
        });

    if (error) {
      console.error(error);
      message.style.color = "red";
      message.textContent =
        "Unable to load shipments.";
      return;
    }

    shipments = data || [];
    const total = shipments.length;

const delivered = shipments.filter(
  s => (s.status || "").toLowerCase() === "delivered"
).length;

const atBorder = shipments.filter(
  s => (s.status || "").toLowerCase() === "at border"
).length;

const active = shipments.filter(
  s => (s.status || "").toLowerCase() !== "delivered"
).length;

document.getElementById("totalCount").textContent = total;
document.getElementById("deliveredCount").textContent = delivered;
document.getElementById("borderCount").textContent = atBorder;
document.getElementById("activeCount").textContent = active;

    const today = new Date();
today.setHours(0, 0, 0, 0);

const delayed = shipments.filter(s => {
  if (!s.eta) return false;

  const status = (s.status || "").trim().toLowerCase();

  if (status === "delivered") return false;

  const etaDate = new Date(s.eta + "T00:00:00");

  return etaDate < today;
}).length;

    document.getElementById("delayedCount").textContent = delayed;

    const delayedCard = document.querySelector(".delayed-card");

if (delayedCard) {
  delayedCard.classList.toggle("alert", delayed > 0);
}

    renderShipments(shipments);
  }


  function renderShipments(list) {

    const table =
      document.getElementById("shipmentTable");

    table.innerHTML = "";

    list.forEach(function(shipment) {

      const row =
        document.createElement("tr");

      row.innerHTML = `
        <td>${shipment.tracking_number || "-"}</td>
        <td>${shipment.status || "-"}</td>
        <td>${shipment.origin || "-"}</td>
        <td>${shipment.destination || "-"}</td>
        <td>${shipment.current_location || "-"}</td>
        <td>${shipment.driver_name || "-"}</td>
        <td>${shipment.truck_number || "-"}</td>
        <td>${shipment.eta || "-"}</td>

        <td>
          <button
            class="edit-btn"
            onclick="editShipment(${shipment.id})">
            EDIT
          </button>

          <button
            class="delete-btn"
            onclick="deleteShipment(${shipment.id})">
            DELETE
          </button>
        </td>
      `;

      table.appendChild(row);
    });
  }


  document
    .getElementById("saveButton")
    .addEventListener(
      "click",
      async function() {

        const id =
          document.getElementById("shipmentId").value;

      let trackingNumber =
  document.getElementById("trackingNumber")
    .value.trim();

if (!id) {
  const { data: newTracking, error: trackingError } =
    await db.rpc("generate_hba_tracking_number");

  if (trackingError) {
    console.error(trackingError);
    message.style.color = "red";
    message.textContent =
      "Unable to generate tracking number.";
    return;
  }

  trackingNumber = newTracking;

  document.getElementById("trackingNumber").value =
    trackingNumber;
}

        const shipmentData = {

          tracking_number:
            trackingNumber,

          status:
            document.getElementById("status").value,

          origin:
            document.getElementById("origin")
              .value.trim(),

          destination:
            document.getElementById("destination")
              .value.trim(),

          current_location:
            document.getElementById("currentLocation")
              .value.trim(),

          truck_number:
            document.getElementById("truckNumber")
              .value.trim(),

          driver_name:
            document.getElementById("driverName")
              .value.trim(),

          eta:
            document.getElementById("eta").value || null,

          last_update:
            new Date().toISOString()
        };


        let result;

        if (id) {

          result =
            await db
              .from("Shipments")
              .update(shipmentData)
              .eq("id", id);

        } else {

          result =
            await db
              .from("Shipments")
              .insert([shipmentData]);
        }


        if (result.error) {

          console.error(result.error);

          message.style.color = "red";

          message.textContent =
            result.error.message;

          return;
        }


        message.style.color = "green";

        message.textContent =
          id
            ? "Shipment updated successfully."
            : "Shipment added successfully.";


        clearForm();

        loadShipments();
      }
    );


  function editShipment(id) {

    const shipment =
      shipments.find(
        item => String(item.id) === String(id)
      );

    if (!shipment) return;


    document.getElementById("shipmentId").value =
      shipment.id;

    document.getElementById("trackingNumber").value =
      shipment.tracking_number || "";

    document.getElementById("status").value =
      shipment.status || "Pending";

    document.getElementById("origin").value =
      shipment.origin || "";

    document.getElementById("destination").value =
      shipment.destination || "";

    document.getElementById("currentLocation").value =
      shipment.current_location || "";

    document.getElementById("truckNumber").value =
      shipment.truck_number || "";

    document.getElementById("driverName").value =
      shipment.driver_name || "";

    document.getElementById("eta").value =
      shipment.eta || "";

    document.getElementById("saveButton").textContent =
      "UPDATE SHIPMENT";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  async function deleteShipment(id) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this shipment?"
      );

    if (!confirmed) return;


    const { error } =
      await db
        .from("Shipments")
        .delete()
        .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "Unable to delete shipment: " +
        error.message
      );

      return;
    }


    loadShipments();
  }


  function clearForm() {

    document.getElementById("shipmentId").value = "";

    document.getElementById("trackingNumber").value = "";

    document.getElementById("status").value =
      "Pending";

    document.getElementById("origin").value = "";

    document.getElementById("destination").value = "";

    document.getElementById("currentLocation").value = "";

    document.getElementById("truckNumber").value = "";

    document.getElementById("driverName").value = "";

    document.getElementById("eta").value = "";

    document.getElementById("saveButton").textContent =
      "ADD SHIPMENT";
  }


  document
    .getElementById("clearButton")
    .addEventListener(
      "click",
      clearForm
    );


  document
    .getElementById("refreshButton")
    .addEventListener(
      "click",
      loadShipments
    );


  document
    .getElementById("searchInput")
    .addEventListener(
      "input",
      function() {

        const search =
          this.value
            .toLowerCase()
            .trim();

        const filtered =
          shipments.filter(function(s) {

            return (
              (s.tracking_number || "")
                .toLowerCase()
                .includes(search)

              ||

              (s.driver_name || "")
                .toLowerCase()
                .includes(search)

              ||

              (s.truck_number || "")
                .toLowerCase()
                .includes(search)

              ||

              (s.destination || "")
                .toLowerCase()
                .includes(search)
            );
          });

        renderShipments(filtered);
      }
    );


  document
    .getElementById("logoutButton")
    .addEventListener(
      "click",
      async function() {

        await db.auth.signOut();

        window.location.href =
          "admin.html";
      }
    );


  loadShipments();

</script>

</body>
</html>
