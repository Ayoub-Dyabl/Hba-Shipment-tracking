<script>

  const supabaseUrl =
    "https://htrcvdnmfodamoatqucb.supabase.co";

  const supabaseKey =
    "sb_publishable_55sANLOQ8OvI822POQnCDg_NebnhOyN";

  const db =
    supabase.createClient(supabaseUrl, supabaseKey);


  const message =
    document.getElementById("message");

  let shipments = [];


  async function checkLogin() {

    const {
      data: { session }
    } = await db.auth.getSession();

    if (!session) {
      window.location.href = "admin.html";
      return false;
    }

    return true;
  }


  async function loadShipments() {

    const loggedIn = await checkLogin();

    if (!loggedIn) return;

    const { data, error } =
      await db
        .from("Shipments")
        .select("*")
        .order("id", {
          ascending: false
        });

    if (error) {
      console.error(error);
      message.style.color = "red";
      message.textContent =
        "Unable to load shipments.";
      return;
    }

    shipments = data || [];
    const total = shipments.length;

const delivered = shipments.filter(
  s => (s.status || "").toLowerCase() === "delivered"
).length;

const atBorder = shipments.filter(
  s => (s.status || "").toLowerCase() === "at border"
).length;

const active = shipments.filter(
  s => (s.status || "").toLowerCase() !== "delivered"
).length;

document.getElementById("totalCount").textContent = total;
document.getElementById("deliveredCount").textContent = delivered;
document.getElementById("borderCount").textContent = atBorder;
document.getElementById("activeCount").textContent = active;

   
const delayed = shipments.filter(
    s => s.delayed === true
).length;

    document.getElementById("delayedCount").textContent = delayed;

    const todayStart = new Date();
todayStart.setHours(0, 0, 0, 0);

const overdue = shipments.filter(s => {
    const status = (s.status || "").trim().toLowerCase();

    if (!s.eta || status === "delivered") {
        return false;
    }

    const etaDate = new Date(s.eta + "T00:00:00");

    return etaDate < todayStart;
}).length;

document.getElementById("overdueCount").textContent = overdue;

    const delayedCard = document.querySelector(".delayed-card");

if (delayedCard) {
  delayedCard.classList.toggle("alert", delayed > 0);
  
  delayedCard.onclick = () => {
        const statusFilter = document.getElementById("statusFilter");
        statusFilter.value = "delayed";
        applyFilters();
    };
}

    const overdueCard = document.querySelector(".overdue-card");

if (overdueCard) {
    overdueCard.classList.toggle("alert", overdue > 0);

    overdueCard.onclick = () => {
        const statusFilter = document.getElementById("statusFilter");
        statusFilter.value = "overdue";
        applyFilters();
    };
}

    const activeCard = document.querySelector(".active-card");
const borderCard = document.querySelector(".border-card");
const deliveredCard = document.querySelector(".delivered-card");
const totalCard = document.querySelector(".total-card");

if (activeCard) {
    activeCard.onclick = () => {
        const statusFilter = document.getElementById("statusFilter");
        statusFilter.value = "active";
        applyFilters();
    };
}

if (borderCard) {
    borderCard.onclick = () => {
        const statusFilter = document.getElementById("statusFilter");
        statusFilter.value = "at border";
        applyFilters();
    };
}

if (deliveredCard) {
    deliveredCard.onclick = () => {
        const statusFilter = document.getElementById("statusFilter");
        statusFilter.value = "delivered";
        applyFilters();
    };
}

if (totalCard) {
    totalCard.onclick = () => {
        const statusFilter = document.getElementById("statusFilter");
        statusFilter.value = "all";
        applyFilters();
    };
}

   document.querySelectorAll(".stat-card").forEach(card => {
    if (card.dataset.selectBound) return;

    card.dataset.selectBound = "true";

    card.addEventListener("click", () => {
        document.querySelectorAll(".stat-card").forEach(c => {
            c.classList.remove("selected");
        });

        card.classList.add("selected");
    });
});
    
    renderShipments(shipments);
  }


  function renderShipments(list) {

    const table =
      document.getElementById("shipmentTable");
    
    const mobileCards =
    document.getElementById("mobileShipmentCards");

    table.innerHTML = "";
    mobileCards.innerHTML = "";

    list.forEach(function(shipment) {

      const row =
        document.createElement("tr");
      
      const status = (shipment.status || "").trim().toLowerCase();

const isDelayed = shipment.delayed === true;

let isOverdue = false;

if (shipment.eta && status !== "delivered") {
    const etaDate = new Date(shipment.eta + "T00:00:00");
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    isOverdue = etaDate < today;
}
      
if (isDelayed) {
  row.classList.add("delayed-row");
}
      
const formattedETA = shipment.eta
  ? new Date(shipment.eta + "T00:00:00").toLocaleDateString("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    })
  : "-";
      
      const formattedLastUpdate = shipment.last_update
    ? new Date(shipment.last_update).toLocaleString("en-GB", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      })
    : "-";

      const mobileCard = document.createElement("div");
mobileCard.className = isDelayed
    ? "mobile-shipment-card delayed-mobile-card"
    : "mobile-shipment-card";

mobileCard.innerHTML = `
    <div class="mobile-card-top">
        <strong>${shipment.tracking_number || "-"}</strong>
        <span>
            ${shipment.status || "-"}
            ${isDelayed ? '<span class="delay-badge">DELAYED</span>' : ''}
            ${isOverdue ? `<span class="overdue-badge">OVERDUE</span>` : ""}
        </span>
    </div>

    <div class="mobile-route">
        ${shipment.origin || "-"} → ${shipment.destination || "-"}
    </div>

    <div class="mobile-card-details">
        <div>📍 <strong>Location:</strong> ${shipment.current_location || "-"}</div>
        <div>👤 <strong>Driver:</strong> ${shipment.driver_name || "-"}</div>
        <div>🚛 <strong>Truck:</strong> ${shipment.truck_number || "-"}</div>
        <div>📅 <strong>ETA:</strong> ${formattedETA}</div>
        <div>🕒 <strong>Updated:</strong> ${formattedLastUpdate}</div>
    </div>

    <div class="mobile-card-actions">
        <button class="edit-btn"
            onclick="editShipment(${shipment.id})">
            EDIT
        </button>

        <button class="delete-btn"
            onclick="deleteShipment(${shipment.id})">
            DELETE
        </button>
    </div>
`;

mobileCards.appendChild(mobileCard);
      
      row.innerHTML = `
        <td>${shipment.tracking_number || "-"}</td>
      <td>
  ${shipment.status || "-"}
  ${isDelayed ? '<span class="delay-badge">DELAYED</span>' : ''}
  ${isOverdue ? `<span class="overdue-badge">OVERDUE</span>` : ""}
</td>
        <td>${shipment.origin || "-"}</td>
        <td>${shipment.destination || "-"}</td>
        <td>${shipment.current_location || "-"}</td>
        <td>${shipment.driver_name || "-"}</td>
        <td>${shipment.truck_number || "-"}</td>
        <td>${formattedETA}</td>
        <td>${formattedLastUpdate}</td>

        <td>
          <button
            class="edit-btn"
            onclick="editShipment(${shipment.id})">
            EDIT
          </button>

          <button
             class="edit-btn"
             onclick="copyShipmentUpdate(${shipment.id})">
            COPY UPDATE
        </button>

        <button
            class="edit-btn"
           onclick="copyTrackingLink('${shipment.tracking_number}')">
           COPY LINK
       </button>

       <button
    class="edit-btn"
    onclick="uploadPOD(${shipment.id}, '${shipment.tracking_number}')">
    UPLOAD POD
</button>

<button
    class="edit-btn"
    onclick="viewPOD('${shipment.pod_path || ""}')">
    VIEW POD
</button>

         <button
            class="delete-btn"
            onclick="deleteShipment(${shipment.id})">
            DELETE
          </button>
        </td>
      `;

      table.appendChild(row);
    });
  }


  document
    .getElementById("saveButton")
    .addEventListener(
      "click",
      async function() {

        const id =
          document.getElementById("shipmentId").value;

      let trackingNumber =
  document.getElementById("trackingNumber")
    .value.trim();

if (!id) {
  const { data: newTracking, error: trackingError } =
    await db.rpc("generate_hba_tracking_number");

  if (trackingError) {
    console.error(trackingError);
    message.style.color = "red";
    message.textContent =
      "Unable to generate tracking number.";
    return;
  }

  trackingNumber = newTracking;

  document.getElementById("trackingNumber").value =
    trackingNumber;
}

        const shipmentData = {

          tracking_number:
            trackingNumber,

          status:
            document.getElementById("status").value,

          origin:
            document.getElementById("origin")
              .value.trim(),

          destination:
            document.getElementById("destination")
              .value.trim(),

          current_location:
            document.getElementById("currentLocation")
              .value.trim(),

          truck_number:
            document.getElementById("truckNumber")
              .value.trim(),

          driver_name:
            document.getElementById("driverName")
              .value.trim(),

          eta:
            document.getElementById("eta").value || null,

          last_update:
            new Date().toISOString()
        };


        let result;

        if (id) {

          result =
            await db
              .from("Shipments")
              .update(shipmentData)
              .eq("id", id);

        } else {

          result =
            await db
              .from("Shipments")
              .insert([shipmentData]);
        }


        if (result.error) {

          console.error(result.error);

          message.style.color = "red";

          message.textContent =
            result.error.message;

          return;
        }


        message.style.color = "green";

        message.textContent =
          id
            ? "Shipment updated successfully."
            : "Shipment added successfully.";


        clearForm();

        loadShipments();
      }
    );


  function editShipment(id) {

    const shipment =
      shipments.find(
        item => String(item.id) === String(id)
      );

    if (!shipment) return;


    document.getElementById("shipmentId").value =
      shipment.id;

    document.getElementById("trackingNumber").value =
      shipment.tracking_number || "";

    document.getElementById("status").value =
      shipment.status || "Pending";

    document.getElementById("origin").value =
      shipment.origin || "";

    document.getElementById("destination").value =
      shipment.destination || "";

    document.getElementById("currentLocation").value =
      shipment.current_location || "";

    document.getElementById("truckNumber").value =
      shipment.truck_number || "";

    document.getElementById("driverName").value =
      shipment.driver_name || "";

    document.getElementById("eta").value =
      shipment.eta || "";

    document.getElementById("saveButton").textContent =
      "UPDATE SHIPMENT";

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  async function copyShipmentUpdate(id) {
    const { data: shipment, error } = await db
        .from("Shipments")
        .select("*")
        .eq("id", id)
        .single();

    if (error || !shipment) {
        alert("Unable to copy shipment update.");
        return;
    }

    const eta = shipment.eta
        ? new Date(shipment.eta + "T00:00:00").toLocaleDateString("en-GB")
        : "-";

    const text =
`HBA Shipment Update

Tracking: ${shipment.tracking_number || "-"}
Route: ${shipment.origin || "-"} → ${shipment.destination || "-"}
Status: ${shipment.status || "-"}
Current Location: ${shipment.current_location || "-"}
ETA: ${eta}`;

    await navigator.clipboard.writeText(text);

    alert("Shipment update copied!");
}

  async function copyTrackingLink(trackingNumber) {
    const link =
        window.location.origin +
        window.location.pathname.replace("dashboard.html", "") +
        "?tracking=" +
        encodeURIComponent(trackingNumber);

    await navigator.clipboard.writeText(link);

    alert("Tracking link copied!");
}
  
  async function uploadPOD(id, trackingNumber) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = ".pdf,.jpg,.jpeg,.png";

    input.onchange = async () => {
        const file = input.files[0];
        if (!file) return;

        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
        const filePath =
            trackingNumber + "/" + Date.now() + "_" + safeName;

        const { error: uploadError } = await db.storage
            .from("pod-files")
            .upload(filePath, file);

        if (uploadError) {
            console.error(uploadError);
            alert("POD upload failed: " + uploadError.message);
            return;
        }

        const { error: updateError } = await db
            .from("Shipments")
            .update({ pod_path: filePath })
            .eq("id", id);

        if (updateError) {
            console.error(updateError);
            alert("POD uploaded, but shipment record could not be updated.");
            return;
        }

        alert("POD uploaded successfully!");
        loadShipments();
    };

    input.click();
}

   async function viewPOD(podPath) {
    if (!podPath) {
        alert("No POD uploaded for this shipment.");
        return;
    }

    const { data, error } = await db.storage
        .from("pod-files")
        .createSignedUrl(podPath, 60);

    if (error || !data) {
        console.error(error);
        alert("Unable to open POD.");
        return;
    }

    window.open(data.signedUrl, "_blank");
}
  
  async function deleteShipment(id) {

    const confirmed =
      confirm(
        "Are you sure you want to delete this shipment?"
      );

    if (!confirmed) return;


    const { error } =
      await db
        .from("Shipments")
        .delete()
        .eq("id", id);


    if (error) {

      console.error(error);

      alert(
        "Unable to delete shipment: " +
        error.message
      );

      return;
    }


    loadShipments();
  }


  function clearForm() {

    document.getElementById("shipmentId").value = "";

    document.getElementById("trackingNumber").value = "";

    document.getElementById("status").value =
      "Pending";

    document.getElementById("origin").value = "";

    document.getElementById("destination").value = "";

    document.getElementById("currentLocation").value = "";

    document.getElementById("truckNumber").value = "";

    document.getElementById("driverName").value = "";

    document.getElementById("eta").value = "";

    document.getElementById("saveButton").textContent =
      "ADD SHIPMENT";
  }


  document
    .getElementById("clearButton")
    .addEventListener(
      "click",
      clearForm
    );


  document
    .getElementById("refreshButton")
    .addEventListener(
      "click",
      loadShipments
    );

  document
    .getElementById("addUpdateButton")
    .addEventListener("click", async function () {

        const trackingNumber =
            document.getElementById("updateTrackingNumber").value.trim();

        const location =
            document.getElementById("updateLocation").value.trim();

        const message =
            document.getElementById("updateMessage").value.trim();

        const dateTime =
            document.getElementById("updateDateTime").value;

        const isDelayed =
             document.getElementById("updateDelayed").checked;

        const delayReason =
             document.getElementById("updateDelayReason").value.trim();

      if (isDelayed && !delayReason) {
    messageBox.style.color = "red";
    messageBox.textContent = "Please enter a delay reason.";
    return;
}

        const messageBox =
            document.getElementById("updateMessageBox");

        if (!trackingNumber || !message) {
            messageBox.style.color = "red";
            messageBox.textContent =
                "Tracking number and update note are required.";
            return;
        }

       const shipment = shipments.find(s =>
    String(s.tracking_number || "")
        .trim()
        .toLowerCase() === trackingNumber
            .trim()
            .toLowerCase()
);

        if (!shipment) {
            messageBox.style.color = "red";
            messageBox.textContent = "Shipment not found.";
            return;
        }

       const history = Array.isArray(shipment.shipment_history)
    ? shipment.shipment_history
    : [];

        history.unshift({
            date: dateTime
                ? new Date(dateTime).toISOString()
                : new Date().toISOString(),
            location: location || "",
            message: message
        });

      const updateText = `${location} ${message}`.toLowerCase();

let autoStatus = null;

if (
    updateText.includes("delivered") ||
    updateText.includes("delivery completed")
) {
    autoStatus = "Delivered";
}
else if (updateText.includes("out for delivery")) {
    autoStatus = "Out for Delivery";
}
else if (
    updateText.includes("customs clearance") ||
    updateText.includes("customs") ||
    updateText.includes("clearance in progress")
) {
    autoStatus = "Customs Clearance";
}
else if (
    updateText.includes("border") ||
    updateText.includes("at border")
) {
    autoStatus = "At Border";
}
else if (
    updateText.includes("in transit") ||
    updateText.includes("departed") ||
    updateText.includes("on the way")
) {
    autoStatus = "In Transit";
}
 else if (
    updateText.includes("offloading") ||
    updateText.includes("unloading") ||
    updateText.includes("waiting for offloading")
) {
    autoStatus = "Out for Delivery";
} 
else if (
    /\bloading\b/.test(updateText) ||
    updateText.includes("being loaded")
) {
    autoStatus = "Loading";
}
      
     const updateData = {
    shipment_history: history,
    last_update: new Date().toISOString(),
    delayed: isDelayed,
    delay_reason: isDelayed ? delayReason : null
};

if (location) {
    updateData.current_location = location;
}
      if (autoStatus) {
    updateData.status = autoStatus;
}

const { error: updateError } =
    await db
        .from("Shipments")
        .update(updateData)
        .eq("id", shipment.id);

        if (updateError) {
            console.error(updateError);

            messageBox.style.color = "red";
            messageBox.textContent =
                "Error: " + updateError.message; 

            return;
        }

        messageBox.style.color = "green";
        messageBox.textContent =
             "Shipment update added successfully.";

        document.getElementById("updateLocation").value = "";
        document.getElementById("updateMessage").value = "";
        document.getElementById("updateDateTime").value = "";
        document.getElementById("updateDelayed").checked = false;
        document.getElementById("updateDelayReason").value = "";

        loadShipments();
    });


 function applyFilters() {
  const search = document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

  const selectedStatus =
    document.getElementById("statusFilter").value;

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const filtered = shipments.filter(function(s) {

    const matchesSearch =
      (s.tracking_number || "").toLowerCase().includes(search) ||
      (s.driver_name || "").toLowerCase().includes(search) ||
      (s.truck_number || "").toLowerCase().includes(search) ||
      (s.destination || "").toLowerCase().includes(search);

    if (!matchesSearch) return false;

    const status = (s.status || "").trim().toLowerCase();

    if (selectedStatus === "all") {
      return true;
    }

    if (selectedStatus === "delayed") {
    return s.delayed === true;
}

    if (selectedStatus === "overdue") {
    if (!s.eta || status === "delivered") {
        return false;
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const etaDate = new Date(s.eta + "T00:00:00");

    return etaDate < today;
}

    if (selectedStatus === "active") {
      return status !== "delivered";
    }

   if (selectedStatus === "at-border") {
    return status === "at border";
}

    if (selectedStatus === "delivered") {
      return status === "delivered";
    }

    return true;
  });

  renderShipments(filtered);
}

document
  .getElementById("searchInput")
  .addEventListener("input", applyFilters);

document
  .getElementById("statusFilter")
  .addEventListener("change", applyFilters);

  document
    .getElementById("logoutButton")
    .addEventListener(
      "click",
      async function() {

        await db.auth.signOut();

        window.location.href =
          "admin.html";
      }
    );


  loadShipments();

</script>
